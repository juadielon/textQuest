services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - npm-cache:/root/.npm
    ports:
      - "5173:5173"
    command: npm run dev

  production:
    build: .
    ports:
      - "8080:80"
    profiles:
      - production

volumes:
  node-modules:
  npm-cache:
